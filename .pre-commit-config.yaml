repos:
- repo: https://github.com/golangci/golangci-lint
  # Pinned to the version CI installs (#813), so local and CI cannot drift.
  rev: v2.15.0
  hooks:
    # Check only: the upstream entry adds `--new-from-rev HEAD --fix`, which both
    # hides pre-existing findings and rewrites the tree (#813).
    - id: golangci-lint-full
      name: golangci-lint (check)
      entry: golangci-lint run --fix=false
    # Opt-in fixer (`make lint-fix`); never runs on commit.
    - id: golangci-lint-full
      name: golangci-lint (fix)
      alias: golangci-lint-fix
      entry: golangci-lint run --fix
      stages: [manual]
