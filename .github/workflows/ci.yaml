name: CI

on:
  workflow_dispatch:
  pull_request:
  # Phase branches are pushed to directly and only occasionally opened as PRs, so
  # without this their history is never checked: a hand-edited config/rbac/role.yaml
  # (verify-manifests) or a red unit-test baseline lands with no run at all, and the
  # first signal is the PR — or the cluster.
  push:
    branches:
      - downstream
      - main
      - 'pgarciaq-rosocp-superpowers-*'

jobs:

  validate-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
      - name: Verify generated Manifests are up to date
        run: make verify-manifests

  # The install check reads `forbidden` lines and splits them into "reconcile is
  # stalled" (fatal) and "a collector degraded" (note). That split is the whole
  # value of the check and is invisible in review, so it is pinned by fixtures.
  # Blocking on every ref: it needs no cluster and cannot flake.
  verify-install-selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Shell syntax
        run: bash -n hack/verify-install.sh hack/verify-install.selftest.sh
      - name: Denial classifier self-test
        run: make verify-install-selftest

  # Same reasoning one level out: the bundle retarget and the index Dockerfile
  # checks exist because their failures are silent (a CSV installs green under
  # the wrong image; an index with no CMD exits 0 and leaves the catalog pod in
  # CrashLoopBackOff with empty logs), so their guards are pinned by fixtures.
  # Neither guard needs a cluster or a container runtime.
  hack-selftests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      # `make hack-selftests` depends on the `yq` target, which derives the
      # download's OS/ARCH from `go env`; pin Go rather than rely on whatever
      # the runner image happens to ship.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Shell syntax
        run: bash -n hack/retarget-bundle.sh hack/retarget-bundle.selftest.sh hack/build-index-image.sh hack/build-index-image.selftest.sh
      - name: Bundle retarget and index Dockerfile self-tests
        run: make hack-selftests

  # bundle/ is regenerated at release time from the release branch, so it can lag
  # config/ for a whole release cycle. That lag is a real defect (a branch image
  # installed under a stale bundle gets `forbidden`, then an empty CR status) but
  # it is not something an unrelated PR should be blocked on. So: block when the
  # artifact itself is edited or the branch is a release branch, warn otherwise.
  verify-bundle-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether drift is blocking
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          blocking=false
          case "${BASE_SHA}" in
            "" | 0000000000000000000000000000000000000000) ;;
            *)
              if git diff --name-only "${BASE_SHA}"...HEAD | grep -q '^bundle/'; then
                blocking=true
              fi
              ;;
          esac
          case "${REF_NAME}" in
            release-* | downstream) blocking=true ;;
          esac
          echo "blocking=${blocking}" >> "${GITHUB_OUTPUT}"
          echo "bundle drift is blocking: ${blocking} (ref=${REF_NAME})"
      - name: Ensure PyYAML
        run: python3 -c 'import yaml' || python3 -m pip install --user --break-system-packages pyyaml
      - name: Verify bundle/ is not missing what config/ requires
        continue-on-error: ${{ steps.scope.outputs.blocking != 'true' }}
        env:
          BUNDLE_DRIFT_ADVISORY: ${{ steps.scope.outputs.blocking != 'true' }}
        run: hack/verify-bundle-drift.sh --check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Display build environment
        run: printenv
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run tests
        run: make test
      - name: Upload test coverage file
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: cover.out

  unit-tests-qemu:
    strategy:
      matrix:
        # arch: [arm64, s390x, ppc64le]  # kubebuilder is not available for s390x yet
        arch: [arm64, ppc64le]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install QEMU
        uses: docker/setup-qemu-action@v4
      - name: Run tests via qemu/binfmt
        run: |
          go env
          make test-qemu
        env:
          GOARCH: ${{ matrix.arch }}

  coverage:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # this checkout is required for the coverage report. If we don't do this, then
        # the uploaded report is invalid and codecov doesn't know how to process it.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download coverage result from unit-tests
        uses: actions/download-artifact@v8
        with:
          name: coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./cover.out
          flags: unittests
          fail_ci_if_error: true
