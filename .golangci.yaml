version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # #813: the gate reports, it never rewrites. A rewriting linter exits 0 after
  # changing the tree, so a dirty tree could never fail. Fixes are opt-in via
  # `make lint-fix`.
  fix: false
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/project-koku/koku-metrics-operator
